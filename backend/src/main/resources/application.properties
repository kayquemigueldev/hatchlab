spring.application.name=hatchlab-backend

server.port=${BACKEND_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/hatchlab}
spring.datasource.username=${POSTGRES_USER:hatchlab}
spring.datasource.password=${POSTGRES_PASSWORD:hatchlab_local_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

hatchlab.admin.username=${LAB_ADMIN_USERNAME:admin}
hatchlab.admin.password=${LAB_ADMIN_PASSWORD:HatchLab!2026}

hatchlab.defense.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}
hatchlab.defense.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:10}

hatchlab.defense.account-lockout.max-failures=${ACCOUNT_LOCKOUT_MAX_FAILURES:3}
hatchlab.defense.account-lockout.failure-window-seconds=${ACCOUNT_LOCKOUT_FAILURE_WINDOW_SECONDS:10}
hatchlab.defense.account-lockout.duration-seconds=${ACCOUNT_LOCKOUT_DURATION_SECONDS:20}

hatchlab.defense.progressive-delay.base-ms=${PROGRESSIVE_DELAY_BASE_MS:200}
hatchlab.defense.progressive-delay.max-ms=${PROGRESSIVE_DELAY_MAX_MS:1000}
hatchlab.defense.progressive-delay.window-seconds=${PROGRESSIVE_DELAY_WINDOW_SECONDS:30}

hatchlab.defense.suspicious-activity.threshold=${SUSPICIOUS_ACTIVITY_THRESHOLD:3}
hatchlab.defense.suspicious-activity.window-seconds=${SUSPICIOUS_ACTIVITY_WINDOW_SECONDS:10}
hatchlab.defense.suspicious-activity.cooldown-seconds=${SUSPICIOUS_ACTIVITY_COOLDOWN_SECONDS:10}

hatchlab.defense.client-throttling.max-failures=${CLIENT_THROTTLING_MAX_FAILURES:4}
hatchlab.defense.client-throttling.window-seconds=${CLIENT_THROTTLING_WINDOW_SECONDS:10}